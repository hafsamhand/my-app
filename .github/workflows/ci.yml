name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build backend
        run: |
          cd apps/backend
          npm ci
          npm run dev

      - name: Build frontend
        run: |
          cd apps/frontend
          npm ci
          npm run dev

      - name: Run tests (placeholder)
        run: echo "Add tests for frontend/backend"
