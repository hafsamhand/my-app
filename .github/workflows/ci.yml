name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root deps
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: mysql://root:password@localhost:3306/monorepo_db
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build backend
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/monorepo_db
        
        run: |
          cd apps/backend
          npm i
          npm run start:dev

      - name: Build frontend
        run: |
          cd apps/frontend
          npm ci
          npm run dev

      - name: Run tests (placeholder)
        run: echo "Add tests for frontend/backend"
